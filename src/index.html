<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>MathShine Check - Nộp bài & Chấm bài trực tuyến</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/jpeg" href="assets/mathshine-logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; }
    .app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; background: #f1f5f9; }
    .app-loading .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .app-loading p { margin-top: 16px; color: #64748b; font-size: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading">
      <div class="spinner"></div>
      <p>Đang tải MathShine Check...</p>
    </div>
  </app-root>
</body>
</html>
